name: Career OS Autonomous Repair Loop

on:
  workflow_run:
    workflows:
      - CI
      - Career OS Autonomous Loop
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Workflow to diagnose"
        required: false
        default: "CI"
        type: choice
        options:
          - CI
          - Career OS Autonomous Loop

# This workflow is intentionally the repair controller, not the product runtime.
# A failed CI/autonomous run becomes the next loop input:
# detect -> diagnose -> modify -> test -> commit -> dispatch CI -> verify.
# The next failed run re-enters this workflow automatically.

permissions:
  contents: write
  actions: write

concurrency:
  group: career-os-autonomous-repair-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  MAX_REPAIR_CYCLES: "3"

jobs:
  repair:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'failure'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Resolve failed run
        id: context
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || inputs.target }}
        run: |
          set -euo pipefail
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "workflow_name=${WORKFLOW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check out exact failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Capture failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
          WORKFLOW_NAME: ${{ steps.context.outputs.workflow_name }}
        run: |
          set -euo pipefail
          mkdir -p .career-os
          {
            echo "Trigger workflow: ${WORKFLOW_NAME}"
            echo "Trigger run: ${RUN_ID:-manual}"
            echo "Trigger commit: ${{ steps.context.outputs.head_sha }}"
            echo
            if [[ -n "${RUN_ID}" ]]; then
              gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 || true
            else
              echo "Manual repair invocation; no triggering run log is available."
            fi
          } | tail -n 30000 > .career-os/self-heal-context.log
          echo "Captured $(wc -l < .career-os/self-heal-context.log) diagnostic lines."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Deterministic baseline
        id: baseline
        continue-on-error: true
        shell: bash
        env:
          TRIGGER_WORKFLOW: ${{ steps.context.outputs.workflow_name }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREER_OS_PUBLIC_JOB_QUERY: ${{ vars.CAREER_OS_PUBLIC_JOB_QUERY || 'support engineer,application support,production support,software support' }}
          CAREER_OS_ADZUNA_QUERY: ${{ vars.CAREER_OS_ADZUNA_QUERY || '' }}
          CAREER_OS_ADZUNA_COUNTRY: ${{ vars.CAREER_OS_ADZUNA_COUNTRY || 'in' }}
          CAREER_OS_ADZUNA_LOCATION: ${{ vars.CAREER_OS_ADZUNA_LOCATION || 'India' }}
          CAREER_OS_ARBEITNOW_QUERY: ${{ vars.CAREER_OS_ARBEITNOW_QUERY || 'support' }}
          CAREER_OS_ARBEITNOW_LOCATION: ${{ vars.CAREER_OS_ARBEITNOW_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_REMOTE_ONLY: ${{ vars.CAREER_OS_ARBEITNOW_REMOTE_ONLY || 'false' }}
          CAREER_OS_PUBLIC_API_MAX_JOBS: "10"
          CAREER_OS_PUBLIC_API_MAX_AGE_DAYS: "2"
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          CAREER_OS_CYCLE_PASSES: "1"
          PYTHONPATH: src
        run: |
          set -o pipefail
          if [[ "${TRIGGER_WORKFLOW}" == "Career OS Autonomous Loop" ]]; then
            python scripts/autonomous_cycle.py 2>&1 | tee .career-os/self-heal-baseline.log
          else
            python -m pytest -q 2>&1 | tee .career-os/self-heal-baseline.log
          fi

      # Primary autonomous executor. Codex receives workspace write access so it
      # can actually inspect, edit, and test the repository instead of merely
      # describing a fix. The GitHub token is not supplied to the model.
      - name: Autonomous diagnose and repair
        id: codex_repair
        if: steps.baseline.outcome == 'failure'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          output-file: .career-os/codex-repair-report.md
          prompt: |
            You are the autonomous repair engineer for CAREER-OS-V2.

            The current checkout is the exact commit that failed. Work directly in
            this repository and do not stop for progress updates.

            REQUIRED LOOP:
            1. Detect the actual failing command from .career-os/self-heal-context.log and
               .career-os/self-heal-baseline.log.
            2. Diagnose the root cause by tracing the relevant code, workflow, tests,
               recent commits, and generated reports. Do not guess.
            3. Inspect the supplied reference patterns when relevant: Auto-Company for
               durable autonomous cycles/state/resilience, ODS for operational recovery,
               Scout for provider-free data collection/fallback ideas, and the existing
               provider-neutral controller in this repository. Reuse patterns, not unrelated code.
            4. Modify the minimum set of files needed to fix the root cause.
            5. Run focused tests, then the relevant full verification command.
            6. If verification fails, continue diagnosing and editing until it passes or
               there is a genuine external blocker.
            7. Leave all successful source/test/workflow changes in the working tree.

            HARD RULES:
            - Never weaken, delete, skip, or falsify a test just to obtain green CI.
            - Never fabricate credentials, job records, candidate evidence, application
              success, or external API results.
            - Never delete the repository, rewrite history, force-push, or modify secrets.
            - Do not commit or push; the controller commits only after verification.
            - Keep professional experience separate from project experience in candidate data.
            - Prefer deterministic fixes and explicit failure states over silent fallbacks.
            - Do not spend time redesigning unrelated product areas.

            Success means the working tree contains a real root-cause fix and the relevant
            verification command passes. If an external credential/quota/service is the only
            blocker, document the exact blocker in .career-os/codex-repair-report.md and make
            the system resumable; do not invent a workaround.

      - name: Verify repaired tree
        id: verify
        continue-on-error: true
        shell: bash
        env:
          TRIGGER_WORKFLOW: ${{ steps.context.outputs.workflow_name }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREER_OS_PUBLIC_JOB_QUERY: ${{ vars.CAREER_OS_PUBLIC_JOB_QUERY || 'support engineer,application support,production support,software support' }}
          CAREER_OS_ADZUNA_QUERY: ${{ vars.CAREER_OS_ADZUNA_QUERY || '' }}
          CAREER_OS_ADZUNA_COUNTRY: ${{ vars.CAREER_OS_ADZUNA_COUNTRY || 'in' }}
          CAREER_OS_ADZUNA_LOCATION: ${{ vars.CAREER_OS_ADZUNA_LOCATION || 'India' }}
          CAREER_OS_ARBEITNOW_QUERY: ${{ vars.CAREER_OS_ARBEITNOW_QUERY || 'support' }}
          CAREER_OS_ARBEITNOW_LOCATION: ${{ vars.CAREER_OS_ARBEITNOW_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_REMOTE_ONLY: ${{ vars.CAREER_OS_ARBEITNOW_REMOTE_ONLY || 'false' }}
          CAREER_OS_PUBLIC_API_MAX_JOBS: "10"
          CAREER_OS_PUBLIC_API_MAX_AGE_DAYS: "2"
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          CAREER_OS_CYCLE_PASSES: "1"
          PYTHONPATH: src
        run: |
          set -o pipefail
          {
            echo "=== Git diff ==="
            git status --short
            git diff --check
            echo "=== Verification ==="
            if [[ "${TRIGGER_WORKFLOW}" == "Career OS Autonomous Loop" ]]; then
              python scripts/autonomous_cycle.py
            else
              python -m pytest -q
            fi
          } 2>&1 | tee .career-os/self-heal-verification.log

      - name: Fail repair if agent could not produce a verified fix
        if: steps.baseline.outcome == 'failure' && steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "Autonomous repair did not reach a verified green state."
          echo "The next eligible failure can re-enter this controller; no unverified change will be pushed."
          exit 1

      - name: Commit verified repair
        if: steps.baseline.outcome == 'failure' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "career-os-autonomous-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .career-os/self-heal-context.log .career-os/self-heal-baseline.log .career-os/self-heal-verification.log .career-os/codex-repair-report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Verification passed but the repair agent produced no repository change."
            exit 1
          fi
          git commit -m "fix: autonomous repair from failed ${{ steps.context.outputs.workflow_name }}"
          git push origin HEAD:main

      # A GITHUB_TOKEN push intentionally does not create a push-triggered workflow.
      # workflow_dispatch is an explicit GitHub-supported exception, so dispatch CI
      # here and let the normal CI -> autonomous -> repair chain continue.
      - name: Re-enter CI with repaired commit
        if: steps.baseline.outcome == 'failure' && steps.verify.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched CI for the verified repair commit."

      - name: Publish controller summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Career OS Autonomous Repair Controller"
            echo
            echo "Trigger: ${{ steps.context.outputs.workflow_name }}"
            echo "Commit inspected: ${{ steps.context.outputs.head_sha }}"
            echo "Baseline: ${{ steps.baseline.outcome }}"
            echo "Codex repair: ${{ steps.codex_repair.outcome }}"
            echo "Verification: ${{ steps.verify.outcome }}"
            echo
            echo "Flow: detect → diagnose → modify → test → commit → dispatch CI → verify → continue"
          } >> "$GITHUB_STEP_SUMMARY"
