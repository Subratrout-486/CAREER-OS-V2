name: Career OS Autonomous Repair Loop

on:
  workflow_run:
    workflows:
      - CI
      - Career OS Autonomous Loop
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Workflow to diagnose"
        required: false
        default: "CI"
        type: choice
        options:
          - CI
          - Career OS Autonomous Loop

# One repair controller only.
# Failed run -> evidence -> Archify map/validation -> Gemini agent repair -> verify
# -> commit -> explicit CI dispatch -> repeat on the next failure.

permissions:
  contents: write
  actions: write

concurrency:
  group: career-os-autonomous-repair-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  GEMINI_MODEL: "gemini-3.6-flash"

jobs:
  repair:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'failure'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Resolve failed run
        id: context
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id || '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || inputs.target }}
        run: |
          set -euo pipefail
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "workflow_name=${WORKFLOW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check out exact failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Capture failure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.context.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .career-os
          {
            echo "Trigger workflow: ${{ steps.context.outputs.workflow_name }}"
            echo "Trigger run: ${RUN_ID:-manual}"
            echo "Trigger commit: ${{ steps.context.outputs.head_sha }}"
            echo
            if [[ -n "${RUN_ID}" ]]; then
              gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed 2>&1 || true
            else
              echo "Manual repair invocation; no triggering run log is available."
            fi
          } | tail -n 30000 > .career-os/self-heal-context.log

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      # Archify is used as the deterministic architecture/flow evidence layer.
      # It is not treated as the code-writing engine; Gemini is the coding agent.
      - name: Prepare Archify evidence tool
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tt-a1i/archify.git "$RUNNER_TEMP/archify"
          node "$RUNNER_TEMP/archify/bin/archify.mjs" doctor
          node "$RUNNER_TEMP/archify/bin/archify.mjs" guide "Map the Career OS autonomous repair flow: failed CI or autonomous cycle -> evidence -> diagnosis -> source repair -> focused tests -> full verification -> verified commit -> explicit CI dispatch -> repeat" --json > .career-os/archify-repair-guide.json

      - name: Deterministic baseline
        id: baseline
        continue-on-error: true
        shell: bash
        env:
          TRIGGER_WORKFLOW: ${{ steps.context.outputs.workflow_name }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREER_OS_PUBLIC_JOB_QUERY: ${{ vars.CAREER_OS_PUBLIC_JOB_QUERY || 'support engineer,application support,production support,software support' }}
          CAREER_OS_ADZUNA_QUERY: ${{ vars.CAREER_OS_ADZUNA_QUERY || '' }}
          CAREER_OS_ADZUNA_COUNTRY: ${{ vars.CAREER_OS_ADZUNA_COUNTRY || 'in' }}
          CAREER_OS_ADZUNA_LOCATION: ${{ vars.CAREER_OS_ADZUNA_LOCATION || 'India' }}
          CAREER_OS_ARBEITNOW_QUERY: ${{ vars.CAREER_OS_ARBEITNOW_QUERY || 'support' }}
          CAREER_OS_ARBEITNOW_LOCATION: ${{ vars.CAREER_OS_ARBEITNOW_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_REMOTE_ONLY: ${{ vars.CAREER_OS_ARBEITNOW_REMOTE_ONLY || 'false' }}
          CAREER_OS_PUBLIC_API_MAX_JOBS: "10"
          CAREER_OS_PUBLIC_API_MAX_AGE_DAYS: "2"
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          CAREER_OS_CYCLE_PASSES: "1"
          PYTHONPATH: src
        run: |
          set -o pipefail
          if [[ "${TRIGGER_WORKFLOW}" == "Career OS Autonomous Loop" ]]; then
            python scripts/autonomous_cycle.py 2>&1 | tee .career-os/self-heal-baseline.log
          else
            python -m pytest -q 2>&1 | tee .career-os/self-heal-baseline.log
          fi

      # Gemini CLI is the free coding-agent runtime. It receives the workspace,
      # shell, and GitHub token needed to inspect and repair the checkout.
      - name: Autonomous diagnose and repair with Gemini
        id: gemini_repair
        if: steps.baseline.outcome == 'failure'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ env.GEMINI_MODEL }}
          prompt: |
            You are the autonomous repair engineer for CAREER-OS-V2.

            Work directly in the checked-out repository. Do not stop for a progress update,
            approval, or explanation before making the repair.

            REQUIRED LOOP:
            1. Detect the actual failing command from .career-os/self-heal-context.log and
               .career-os/self-heal-baseline.log.
            2. Diagnose the root cause from source, tests, workflow definitions, recent commits,
               and generated reports. Reproduce the failure when practical. Do not guess.
            3. Inspect .career-os/archify-repair-guide.json and use the Archify CLI at
               $RUNNER_TEMP/archify when a workflow/architecture map or deterministic diagnostic
               is useful. Archify is an evidence/validation layer, not a substitute for tests.
            4. Reuse proven patterns from the public Auto-Company repository when relevant:
               persistent cycle state, bounded recovery, cooldown/circuit-breaker behavior,
               last-good state, and resumable handoff. Do not copy unrelated application code.
            5. Modify the minimum set of files required for the root-cause fix.
            6. Run focused regression tests, then the complete verification command for the
               failing path.
            7. If verification fails, continue diagnosing and editing in this same run until
               it passes or a genuine external blocker is proven.

            HARD RULES:
            - Never weaken, delete, skip, or falsify a test to make CI green.
            - Never fabricate credentials, jobs, candidate evidence, applications, or external results.
            - Never modify repository secrets, rewrite history, force-push, or delete the repository.
            - Do not commit or push. The controller commits only after verification succeeds.
            - Preserve explicit failure states and resumability; do not silently swallow errors.
            - Do not redesign unrelated product areas.

            The working tree must contain the real fix and the relevant verification must pass.
            If the blocker is genuinely external (credential/quota/provider outage), document the
            exact blocker in .career-os/gemini-repair-report.md and leave the repository resumable.

      - name: Verify repaired tree
        id: verify
        if: steps.baseline.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          TRIGGER_WORKFLOW: ${{ steps.context.outputs.workflow_name }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREER_OS_PUBLIC_JOB_QUERY: ${{ vars.CAREER_OS_PUBLIC_JOB_QUERY || 'support engineer,application support,production support,software support' }}
          CAREER_OS_ADZUNA_QUERY: ${{ vars.CAREER_OS_ADZUNA_QUERY || '' }}
          CAREER_OS_ADZUNA_COUNTRY: ${{ vars.CAREER_OS_ADZUNA_COUNTRY || 'in' }}
          CAREER_OS_ADZUNA_LOCATION: ${{ vars.CAREER_OS_ADZUNA_LOCATION || 'India' }}
          CAREER_OS_ARBEITNOW_QUERY: ${{ vars.CAREER_OS_ARBEITNOW_QUERY || 'support' }}
          CAREER_OS_ARBEITNOW_LOCATION: ${{ vars.CAREER_OS_ARBEITNOW_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_REMOTE_ONLY: ${{ vars.CAREER_OS_ARBEITNOW_REMOTE_ONLY || 'false' }}
          CAREER_OS_PUBLIC_API_MAX_JOBS: "10"
          CAREER_OS_PUBLIC_API_MAX_AGE_DAYS: "2"
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          CAREER_OS_CYCLE_PASSES: "1"
          PYTHONPATH: src
        run: |
          set -o pipefail
          git diff --check
          if [[ "${TRIGGER_WORKFLOW}" == "Career OS Autonomous Loop" ]]; then
            python scripts/autonomous_cycle.py
          else
            python -m pytest -q
          fi

      - name: Commit verified repair
        if: steps.baseline.outcome == 'failure' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "career-os-autonomous-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .career-os/self-heal-context.log .career-os/self-heal-baseline.log .career-os/archify-repair-guide.json .career-os/gemini-repair-report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Verification passed but Gemini produced no repository change."
            exit 1
          fi
          git commit -m "fix: autonomous repair from failed ${{ steps.context.outputs.workflow_name }}"
          git push origin HEAD:main

      - name: Re-enter CI after verified repair
        if: steps.baseline.outcome == 'failure' && steps.verify.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Publish controller summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Career OS Autonomous Repair Controller"
            echo
            echo "Trigger: ${{ steps.context.outputs.workflow_name }}"
            echo "Commit inspected: ${{ steps.context.outputs.head_sha }}"
            echo "Baseline: ${{ steps.baseline.outcome }}"
            echo "Gemini repair: ${{ steps.gemini_repair.outcome }}"
            echo "Verification: ${{ steps.verify.outcome }}"
            echo
            echo "Flow: detect -> diagnose -> Archify evidence -> modify -> test -> verify -> commit -> CI -> continue"
          } >> "$GITHUB_STEP_SUMMARY"
