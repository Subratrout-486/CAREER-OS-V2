name: Career OS Autonomous Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [career-os-continue]
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: career-os-autonomous-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  autonomous-cycle:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Career OS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Chromium for browser-backed departments
        shell: bash
        run: python -m playwright install --with-deps chromium
      - name: Run provider-free real-job smoke cycle
        id: smoke
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/native_job_smoke_test.py
      - name: Verify native cycle artifact exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .career-os/native-smoke-result.json
      - name: Publish native cycle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .career-os/native-smoke-result.json ]]; then
            {
              echo '## Career OS native cycle'
              echo
              echo 'Provider-independent job ingestion and deterministic pipeline execution completed.'
              echo
              echo '```json'
              cat .career-os/native-smoke-result.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload native cycle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-native-smoke
          path: .career-os/native-smoke-result.json
          if-no-files-found: error
