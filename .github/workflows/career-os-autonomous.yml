name: Career OS Autonomous Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [career-os-continue]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: career-os-autonomous-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Career OS
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic test suite
        run: python -m pytest

      - name: Run provider-free Career OS automation
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/career_os_automation.py \
            --sources config/public_ats_sources.json \
            --candidate candidate/source_of_truth.json \
            --output .career-os/automation-run.json

      - name: Publish automation summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('.career-os/automation-run.json').read_text())
          print('## Career OS — provider-free autonomous run')
          print()
          print(f"- Status: **{report['status']}**")
          print(f"- Sources configured: **{len(report['sources'])}**")
          print(f"- Jobs discovered: **{report['jobs_discovered']}**")
          print(f"- Jobs evaluated: **{report['jobs_evaluated']}**")
          print('- LLM provider: **not required**')
          print('- Provider credentials: **not required**')
          print('- Application submission: **disabled**')
          print()
          for source in report['sources']:
              state = 'OK' if not source['error'] else f"ERROR: {source['error']}"
              print(f"- `{source['url']}` — {source['jobs']} jobs — {state}")
          PY

      - name: Upload automation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-automation-report
          path: .career-os/automation-run.json
          if-no-files-found: error
          retention-days: 14
