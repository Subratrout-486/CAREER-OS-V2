name: Career OS Autonomous Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [career-os-continue]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: career-os-autonomous-loop
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact triggering commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Verified exact commit: $ACTUAL_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Career OS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Chromium for browser-backed departments
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Execute autonomous discovery → processing → finalization loop
        id: cycle
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREER_OS_PUBLIC_JOB_QUERY: ${{ vars.CAREER_OS_PUBLIC_JOB_QUERY || 'support engineer,application support,production support,software support' }}
          CAREER_OS_ADZUNA_QUERY: ${{ vars.CAREER_OS_ADZUNA_QUERY || '' }}
          CAREER_OS_ADZUNA_COUNTRY: ${{ vars.CAREER_OS_ADZUNA_COUNTRY || 'in' }}
          CAREER_OS_ADZUNA_LOCATION: ${{ vars.CAREER_OS_ADZUNA_LOCATION || 'India' }}
          CAREER_OS_ARBEITNOW_QUERY: ${{ vars.CAREER_OS_ARBEITNOW_QUERY || 'support' }}
          CAREER_OS_ARBEITNOW_LOCATION: ${{ vars.CAREER_OS_ARBEITNOW_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_REMOTE_ONLY: ${{ vars.CAREER_OS_ARBEITNOW_REMOTE_ONLY || 'false' }}
          CAREER_OS_OPEN_SKILLS_ENABLED: ${{ vars.CAREER_OS_OPEN_SKILLS_ENABLED || 'false' }}
          CAREER_OS_OPEN_SKILLS_BASE_URL: ${{ vars.CAREER_OS_OPEN_SKILLS_BASE_URL || 'http://api.dataatwork.org/v1' }}
          CAREER_OS_OPEN_SKILLS_ALLOW_HTTP: ${{ vars.CAREER_OS_OPEN_SKILLS_ALLOW_HTTP || 'false' }}
          CAREER_OS_PUBLIC_API_MAX_JOBS: "20"
          CAREER_OS_PUBLIC_API_MAX_AGE_DAYS: "2"
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          CAREER_OS_CYCLE_PASSES: "2"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/autonomous_cycle.py

      # provider-free smoke cycle (diagnostic only)
      - name: Run provider-free smoke cycle (diagnostic only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/native_job_smoke_test.py

      - name: Verify native cycle artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s .career-os/native-smoke-result.json ]]; then
            echo "Native smoke artifact present."
          else
            echo "Native smoke artifact missing; keeping cycle diagnostic-only for this check."
          fi

      - name: Publish autonomous health summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Career OS autonomous cycle'
            echo
            echo "Trigger: ${{ github.event_name }}"
            echo "Commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
            echo "Controller outcome: ${{ steps.cycle.outcome }}"
            for report in .career-os/autonomous-cycle-report.json .career-os/public-job-api-report.json .career-os/notion-worker-report.json .career-os/resume-finalize-report.json .career-os/native-smoke-result.json; do
              if [[ -f "$report" ]]; then
                echo "### $(basename "$report")"
                echo '```json'
                cat "$report"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload autonomous reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-cycle-reports
          path: |
            .career-os/autonomous-cycle-report.json
            .career-os/native-smoke-result.json
            .career-os/notion-worker-report.json
            .career-os/public-job-api-report.json
            .career-os/resume-finalize-report.json
            .career-os/resume/
          if-no-files-found: warn
          include-hidden-files: true
