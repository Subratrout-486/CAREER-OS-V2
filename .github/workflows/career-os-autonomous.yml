name: Career OS Autonomous Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [career-os-continue]
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: career-os-autonomous-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

jobs:
  autonomous-cycle:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out workspace for headless Gemini
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gemini"
          printf '{"%s":"TRUST_FOLDER"}\n' "$GITHUB_WORKSPACE" > "$HOME/.gemini/trustedFolders.json"
          chmod 600 "$HOME/.gemini/trustedFolders.json"

      - name: Select first authorized provider
        id: controller
        shell: bash
        env:
          PYTHONPATH: src
          CAREER_OS_STATE: .career-os/provider-state.json
          HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          set -euo pipefail
          providers=""
          [[ "$HAS_GEMINI_KEY" == true ]] && providers="gemini"
          [[ "$HAS_OPENAI_KEY" == true ]] && providers="${providers:+$providers,}codex"
          if [[ -z "$providers" ]]; then
            echo "No authorized provider secret is configured." >&2
            exit 1
          fi
          CAREER_OS_PROVIDERS="$providers" python scripts/career_os_provider_controller.py start --departments "current" \
            || { echo "Provider controller could not initialize." >&2; exit 1; }

      - name: Run Career OS cycle with Gemini
        id: gemini
        if: steps.controller.outputs.provider == 'gemini'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "preview"
          gemini_debug: false
          upload_artifacts: false
          workflow_name: "career-os-autonomous"
          prompt-file: .career-os/AUTONOMOUS_AGENT_PROMPT.md
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "tools": {
                "sandbox": "docker"
              }
            }

      - name: Select fallback after Gemini failure
        id: fallback
        if: steps.controller.outputs.provider == 'gemini' && steps.gemini.outcome == 'failure'
        shell: bash
        env:
          PYTHONPATH: src
          CAREER_OS_STATE: .career-os/provider-state.json
          CAREER_OS_PROVIDERS: gemini,codex
          PROVIDER_FAILURE_MESSAGE: ${{ steps.gemini.outputs.gemini_errors || 'Gemini provider action failed; inspect this run for the provider error.' }}
        run: |
          set -euo pipefail
          python scripts/career_os_provider_controller.py failure \
            --provider gemini \
            --message "$PROVIDER_FAILURE_MESSAGE"

      - name: Run fallback Career OS cycle with Codex
        id: codex
        if: steps.fallback.outputs.provider == 'codex'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt-file: .career-os/AUTONOMOUS_AGENT_PROMPT.md

      - name: Record fallback provider failure
        if: steps.fallback.outputs.provider == 'codex' && steps.codex.outcome == 'failure'
        shell: bash
        env:
          PYTHONPATH: src
          CAREER_OS_STATE: .career-os/provider-state.json
          CAREER_OS_PROVIDERS: gemini,codex
          PROVIDER_FAILURE_MESSAGE: "Codex provider action failed; inspect this run for the provider error."
        run: |
          set -euo pipefail
          python scripts/career_os_provider_controller.py failure \
            --provider codex \
            --message "$PROVIDER_FAILURE_MESSAGE"

      - name: Publish provider-blocked handoff
        if: always() && hashFiles('.career-os/provider-state.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"status": "provider_blocked"' .career-os/provider-state.json; then
            {
              echo '## PROVIDER_BLOCKED'
              echo
              echo 'No already-authorized provider remains for the current department.'
              echo 'The controller preserved the department state and requires provider recovery or another authorized provider.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Fail if selected provider failed without fallback
        if: steps.controller.outputs.provider == 'gemini' && steps.gemini.outcome == 'failure' && steps.fallback.outputs.provider != 'codex'
        run: exit 1
