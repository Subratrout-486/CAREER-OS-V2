name: Career OS Autonomous Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [career-os-continue]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: career-os-autonomous-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  autonomous-cycle:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact triggering commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Verified exact commit: $ACTUAL_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Career OS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Chromium for browser-backed departments
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Process queued Notion jobs
        id: notion-worker
        continue-on-error: true
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/notion_job_worker.py

      - name: Publish Notion worker report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .career-os/notion-worker-report.json ]]; then
            {
              echo '## Career OS Notion worker'
              echo
              echo '```json'
              cat .career-os/notion-worker-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Career OS Notion worker' >> "$GITHUB_STEP_SUMMARY"
            echo 'No worker report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run provider-free real-job smoke cycle
        id: smoke
        if: always()
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/native_job_smoke_test.py

      - name: Verify native cycle artifacts exist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .career-os/native-smoke-result.json
          test -s .career-os/resume/*.pdf
          test -s .career-os/resume/*.html

      - name: Verify systemic Notion worker health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .career-os/notion-worker-report.json ]] && grep -q '"error"' .career-os/notion-worker-report.json; then
            echo 'Systemic Notion worker failure detected; failing the cycle after the smoke test completed.'
            exit 1
          fi

      - name: Publish native cycle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .career-os/native-smoke-result.json ]]; then
            {
              echo '## Career OS native cycle'
              echo
              echo 'Provider-independent job ingestion, deterministic pipeline execution, and candidate-facing resume generation completed on the exact triggering commit.'
              echo
              echo '```json'
              cat .career-os/native-smoke-result.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Career OS cycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-cycle-reports
          path: |
            .career-os/native-smoke-result.json
            .career-os/notion-worker-report.json
            .career-os/resume/
          if-no-files-found: warn
          include-hidden-files: true
