name: Career OS Autonomous Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [career-os-continue]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: career-os-autonomous-loop
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  autonomous-cycle:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact triggering commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Verified exact commit: $ACTUAL_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Career OS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Chromium for browser-backed departments
        shell: bash
        run: python -m playwright install --with-deps chromium

      - name: Process queued Notion jobs
        id: notion-worker
        continue-on-error: true
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          CAREER_OS_MAX_JOBS: "10"
          CAREER_OS_NOTION_PAGE_SIZE: "25"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/notion_job_worker_runtime.py

      - name: Fetch and process public API jobs
        id: public-job-api
        continue-on-error: true
        shell: bash
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREER_OS_PUBLIC_JOB_QUERY: ${{ vars.CAREER_OS_PUBLIC_JOB_QUERY || '' }}
          CAREER_OS_ADZUNA_QUERY: ${{ vars.CAREER_OS_ADZUNA_QUERY || '' }}
          CAREER_OS_ADZUNA_COUNTRY: ${{ vars.CAREER_OS_ADZUNA_COUNTRY || 'in' }}
          CAREER_OS_ADZUNA_LOCATION: ${{ vars.CAREER_OS_ADZUNA_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_QUERY: ${{ vars.CAREER_OS_ARBEITNOW_QUERY || '' }}
          CAREER_OS_ARBEITNOW_LOCATION: ${{ vars.CAREER_OS_ARBEITNOW_LOCATION || '' }}
          CAREER_OS_ARBEITNOW_REMOTE_ONLY: ${{ vars.CAREER_OS_ARBEITNOW_REMOTE_ONLY || 'false' }}
          CAREER_OS_OPEN_SKILLS_ENABLED: ${{ vars.CAREER_OS_OPEN_SKILLS_ENABLED || 'false' }}
          CAREER_OS_OPEN_SKILLS_BASE_URL: ${{ vars.CAREER_OS_OPEN_SKILLS_BASE_URL || 'http://api.dataatwork.org/v1' }}
          CAREER_OS_OPEN_SKILLS_ALLOW_HTTP: ${{ vars.CAREER_OS_OPEN_SKILLS_ALLOW_HTTP || 'false' }}
          CAREER_OS_PUBLIC_API_MAX_JOBS: "20"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/public_job_api_worker.py
          test -s .career-os/public-job-api-report.json

      - name: Finalize verified candidate resumes
        id: resume-finalize
        if: always() && steps.notion-worker.outcome != 'failure'
        continue-on-error: true
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID || '8374c380-f148-41ab-a77f-eb35de20f2db' }}
          CAREER_OS_MAX_JOBS: "10"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/notion_resume_finalize.py

      - name: Run provider-free smoke cycle (diagnostic only)
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/native_job_smoke_test.py

      - name: Verify native cycle artifacts
        if: steps.smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s .career-os/native-smoke-result.json
          test -n "$(find .career-os/resume -maxdepth 1 -type f -name '*.pdf' -print -quit)"
          test -n "$(find .career-os/resume -maxdepth 1 -type f -name '*.html' -print -quit)"

      - name: Publish autonomous health summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Career OS autonomous cycle'
            echo
            echo "Trigger: ${{ github.event_name }}"
            echo "Commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
            echo "Notion worker outcome: ${{ steps.notion-worker.outcome }}"
            echo "Public API worker outcome: ${{ steps.public-job-api.outcome }}"
            echo "Resume finalizer outcome: ${{ steps.resume-finalize.outcome }}"
            echo "Provider-free smoke outcome: ${{ steps.smoke.outcome }}"
            echo
            for report in .career-os/notion-worker-report.json .career-os/public-job-api-report.json .career-os/resume-finalize-report.json .career-os/native-smoke-result.json; do
              if [[ -f "$report" ]]; then
                echo "### $(basename "$report")"
                echo '```json'
                cat "$report"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload autonomous reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-cycle-reports
          path: |
            .career-os/native-smoke-result.json
            .career-os/notion-worker-report.json
            .career-os/public-job-api-report.json
            .career-os/resume-finalize-report.json
            .career-os/resume/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Fail only on systemic Notion intake failure
        if: steps.notion-worker.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "The Notion worker failed at the system level. Individual job failures must be recorded in the worker report and must not fail the batch."
          exit 1
