name: CI

on:
  push:
    branches: [main, feat/arachne-direct-api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install Chromium for PDF tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - name: Run live Greenhouse → Arachne smoke test
        env:
          CAREER_OS_CONDUCTOR_TOKEN: arachne-live-smoke-token
        run: python scripts/arachne_live_smoke.py
