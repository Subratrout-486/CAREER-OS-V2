name: Production Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: career-os-production-gate
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Career OS
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Chromium for PDF and browser-backed tests
        run: python -m playwright install --with-deps chromium

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run native end-to-end smoke test
        run: python scripts/native_job_smoke_test.py

      - name: Verify smoke result
        run: |
          set -euo pipefail
          test -s .career-os/native-smoke-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.career-os/native-smoke-result.json')
          data = json.loads(p.read_text())
          if data.get('status') not in {'passed', 'success'}:
              raise SystemExit(f"Native smoke did not pass: {data}")
          print('Verified native smoke result:', data.get('status'))
          PY

      - name: Upload production-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-production-gate
          path: .career-os/native-smoke-result.json
          if-no-files-found: warn
          include-hidden-files: true
