profile:
  name: Subrat Rout
  positioning: "Production -> Data -> Product"
  primary_identity: "Production/Application Support Engineer"
  target_direction:
    - Product Management
    - Technical Product Management
    - Product Operations
    - enterprise technology roles

pillars:
  production_to_product:
    weight: 0.40
    themes:
      - production incidents as product signals
      - root cause vs symptom
      - technical severity vs user impact
      - reliability and user experience
      - engineering/product collaboration
  data_enterprise_fintech:
    weight: 0.35
    themes:
      - SQL and database troubleshooting
      - enterprise application dependencies
      - batch processing
      - data quality
      - APIs and integrations
      - financial and governance data
  support_to_product:
    weight: 0.25
    themes:
      - product-management learning
      - project building
      - translating support experience into product thinking
      - product prioritization
      - career transition lessons

weekly_mix:
  monday: teaching
  wednesday: story_or_opinion
  friday: proof
  saturday: carousel
  sunday: performance_review

success_metrics:
  primary:
    - relevant_profile_visits
    - relevant_connections
    - meaningful_conversations
    - recruiter_conversations
    - product_leader_conversations
    - interviews_or_referrals
  secondary:
    - impressions
    - followers
    - saves
    - shares
    - comments

rules:
  never_fabricate_experience: true
  never_fabricate_metrics: true
  never_disclose_confidential_information: true
  no_spam: true
  no_platform_control_evasion: true
  human_supervision_default: true
