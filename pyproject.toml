[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "career-os-v2"
version = "0.1.0"
description = "Foundation for the incrementally built Career OS V2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "CAREER-OS-V2 Contributors" },
]
dependencies = [
  "pydantic>=2.11,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
openai-agents = [
  "openai-agents>=0.2.0",
]
dev = [
  "pytest>=8.0",
  "playwright>=1.52",
  "pypdf>=5.0",
  "httpx2>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/career_os"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
